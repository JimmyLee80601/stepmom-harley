name: Build and Release Step-Mom Harley APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Signing Keystore
      run: |
        keytool -genkeypair \
          -alias stepmomharley \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -keystore app/release-keystore.jks \
          -storepass StepMomHarley2026 \
          -keypass StepMomHarley2026 \
          -dname "CN=Harley, OU=StepMom, O=HarleyOS, L=Texas, ST=TX, C=US"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=app/release-keystore.jks \
          -Pandroid.injected.signing.store.password=StepMomHarley2026 \
          -Pandroid.injected.signing.key.alias=stepmomharley \
          -Pandroid.injected.signing.key.password=StepMomHarley2026

    - name: Find APK
      id: find-apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        cp "$APK_PATH" stepmom-harley-v1.0.0.apk || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stepmom-harley-v1.0.0
        path: stepmom-harley-v1.0.0.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: stepmom-harley-v1.0.0.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
